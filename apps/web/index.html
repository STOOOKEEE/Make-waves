<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F6AFF" />
    <meta
      name="description"
      content="Learn to trade crypto for free: 16 bilingual lessons, a practice terminal on real market data with virtual capital, and on-chain competitions on XRPL."
    />
    <title>TIDE — Learn to trade crypto with virtual money</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://tidetrade.xyz/" />

    <!-- Cartes de partage. Tide est une SPA en hash-routing sans SSR : les
         scrapers sociaux n'exécutent pas le JS et ne lisent que ce fichier.
         Ces balises doivent donc rester statiques ici, pas être injectées au
         runtime. Pas de `twitter:card=summary_large_image` tant qu'aucune
         image de partage n'existe : une carte large vide est pire qu'une
         carte simple. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TIDE" />
    <meta property="og:url" content="https://tidetrade.xyz/" />
    <meta property="og:title" content="TIDE — Learn to trade crypto with virtual money" />
    <meta
      property="og:description"
      content="Learn to trade crypto for free: 16 bilingual lessons, a practice terminal on real market data with virtual capital, and on-chain competitions on XRPL."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TIDE — Learn to trade crypto with virtual money" />
    <meta
      name="twitter:description"
      content="16 free bilingual lessons, a practice terminal on real market data, and on-chain competitions on XRPL."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
