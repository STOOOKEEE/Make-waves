<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tide">
  <rect width="64" height="64" rx="13" fill="#08090B"/>
  <!-- Bandes centrales épaissies (16px-safe) : on ne garde que opacité >= 0.55 -->
  <rect x="15" y="20" width="34" height="4.4" rx="2.2" fill="#E9ECF1" fill-opacity="0.55"/>
  <rect x="21" y="28.5" width="22" height="4.4" rx="2.2" fill="#E9ECF1" fill-opacity="0.85"/>
  <!-- Tideline bleue pleine + nœud de lecture -->
  <rect x="9" y="38" width="46" height="4.6" rx="2.3" fill="#5C9BFF"/>
  <circle cx="44" cy="40.3" r="4.2" fill="#5C9BFF"/>
  <rect x="21" y="48" width="22" height="4.4" rx="2.2" fill="#E9ECF1" fill-opacity="0.55"/>
</svg>
