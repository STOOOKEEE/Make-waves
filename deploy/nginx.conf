# Sert le front Tide (SPA Vue). Le front appelle l'API sur api.tidetrade.xyz
# (cross-origin, CORS ouvert côté API), donc pas de reverse-proxy ici.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache long pour les assets fingerprintés de Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback : toute route non-fichier → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
